name: E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    if: github.repository == 'athasdev/athas'
    name: E2E — ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
          - name: Windows
            os: windows-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v6

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev \
            patchelf webkit2gtk-driver xvfb dbus

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.18.0
        with:
          node-version-file: .node-version
          cache: true
          run-install: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cache Bun dependencies
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: e2e
          cache-on-failure: true

      - name: Install tauri-driver (Linux)
        if: runner.os == 'Linux'
        run: cargo install tauri-driver --locked

      # Windows skips tauri-driver: the harness launches the app and attaches
      # msedgedriver to its DevTools port (see e2e/support/driver.ts).
      - name: Install msedgedriver (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo install --git https://github.com/chippers/msedgedriver-tool
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\msedgedriver" | Out-Null
          Push-Location "$env:RUNNER_TEMP\msedgedriver"
          & "$HOME\.cargo\bin\msedgedriver-tool.exe"
          Pop-Location
          "TAURI_NATIVE_DRIVER=$env:RUNNER_TEMP\msedgedriver\msedgedriver.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install frontend dependencies
        run: vp install --ignore-scripts && bun scripts/postinstall.ts

      - name: Build the e2e app (Linux)
        if: runner.os == 'Linux'
        run: bun run e2e:build

      - name: Build the e2e app (Windows)
        if: runner.os == 'Windows'
        run: bun run e2e:build:windows

      - name: Run e2e tests (Linux)
        if: runner.os == 'Linux'
        env:
          ATHAS_E2E_SKIP_BUILD: "1"
          ATHAS_DISABLE_LINUX_GPU: "1"
        run: dbus-run-session -- xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" bun run e2e

      - name: Run e2e tests (Windows)
        if: runner.os == 'Windows'
        env:
          ATHAS_E2E_SKIP_BUILD: "1"
          RUST_BACKTRACE: "1"
        run: bun run e2e

      - name: Upload e2e artifacts
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-${{ runner.os }}
          path: target/e2e/artifacts
          if-no-files-found: ignore
          retention-days: 14
