name: E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    if: github.repository == 'athasdev/athas'
    name: E2E — ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
          - name: Windows
            os: windows-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v6

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev \
            patchelf webkit2gtk-driver xvfb dbus

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.18.0
        with:
          node-version-file: .node-version
          cache: true
          run-install: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: e2e
          cache-on-failure: true

      - name: Install tauri-driver
        run: cargo install tauri-driver --locked

      - name: Install msedgedriver (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo install --git https://github.com/chippers/msedgedriver-tool
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\msedgedriver" | Out-Null
          Push-Location "$env:RUNNER_TEMP\msedgedriver"
          & "$HOME\.cargo\bin\msedgedriver-tool.exe"
          Pop-Location
          # tauri-driver cannot pass flags to the native driver, so a wrapper
          # turns on msedgedriver's verbose log and writes it with the artifacts.
          $artifacts = "$env:GITHUB_WORKSPACE\target\e2e\artifacts"
          New-Item -ItemType Directory -Force -Path $artifacts | Out-Null
          $wrapper = "$env:RUNNER_TEMP\msedgedriver\msedgedriver-verbose.cmd"
          Set-Content -Path $wrapper -Encoding ascii -Value @(
            '@echo off',
            "`"%~dp0msedgedriver.exe`" %* --verbose `"--log-path=$artifacts\msedgedriver.log`""
          )
          "TAURI_NATIVE_DRIVER=$wrapper" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install frontend dependencies
        run: vp install --ignore-scripts && bun scripts/postinstall.ts

      - name: Build the e2e app
        run: bun run e2e:build

      - name: Run e2e tests (Linux)
        if: runner.os == 'Linux'
        env:
          ATHAS_E2E_SKIP_BUILD: "1"
          ATHAS_DISABLE_LINUX_GPU: "1"
        run: dbus-run-session -- xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" bun run e2e

      # Launches the e2e build without WebDriver so a crash at startup shows up
      # here with its exit code and logs instead of as a driver timeout.
      - name: Check that the e2e app starts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RUST_BACKTRACE: "1"
        run: |
          $artifacts = "$env:GITHUB_WORKSPACE\target\e2e\artifacts\startup-check"
          New-Item -ItemType Directory -Force -Path $artifacts | Out-Null
          $project = "$env:RUNNER_TEMP\startup-check\sample-project"
          Copy-Item -Recurse -Force e2e\fixtures\sample-project $project
          $app = Start-Process -FilePath target\debug\athas.exe -ArgumentList "`"$project`"" -PassThru `
            -RedirectStandardOutput "$artifacts\stdout.log" -RedirectStandardError "$artifacts\stderr.log"
          Start-Sleep -Seconds 20
          $running = -not $app.HasExited
          if ($running) { Stop-Process -Id $app.Id -Force } else { "exit code: $($app.ExitCode)" }
          Get-Content "$artifacts\stdout.log", "$artifacts\stderr.log" -ErrorAction SilentlyContinue
          if (Test-Path target\debug\e2e-app-data\logs) {
            Copy-Item -Recurse target\debug\e2e-app-data\logs "$artifacts\app-logs"
            Get-Content target\debug\e2e-app-data\logs\*.log -Tail 40
          }
          Remove-Item -Recurse -Force target\debug\e2e-app-data -ErrorAction SilentlyContinue
          if (-not $running) { throw "The e2e app exited during startup" }

      - name: Run e2e tests (Windows)
        if: runner.os == 'Windows'
        env:
          ATHAS_E2E_SKIP_BUILD: "1"
        run: bun run e2e

      - name: Upload e2e artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ runner.os }}
          path: target/e2e/artifacts
          if-no-files-found: ignore
          retention-days: 14
