name: Deploy Web Editor

# Builds the browser workbench (bun run build:web) and deploys it to Cloudflare Workers static
# assets as the athas-web-editor Worker on editor.athas.dev. The athas.dev dashboard embeds it.
#
# Needs the repository secrets CLOUDFLARE_API_TOKEN (Workers Scripts: Edit, plus Zone: Workers
# Routes: Edit and DNS: Edit on athas.dev for the custom domain) and CLOUDFLARE_ACCOUNT_ID.
# The optional repository variable WEB_EDITOR_FRAME_ANCESTORS replaces the origins allowed to
# frame the editor (space separated, default https://athas.dev).

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "web.html"
      - "web/**"
      - "vite.config.ts"
      - "vite.web.config.ts"
      - "scripts/vite/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/deploy-web-editor.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-web-editor
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'athasdev/athas'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.18.0
        with:
          node-version-file: .node-version
          cache: true
          run-install: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: vp install --ignore-scripts

      - name: Test the in-memory backend
        run: vp test run src/features/web-workbench

      - name: Build the web editor
        env:
          WEB_EDITOR_FRAME_ANCESTORS: ${{ vars.WEB_EDITOR_FRAME_ANCESTORS }}
        run: bun run build:web

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          wranglerVersion: "4"
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: web
          command: deploy
