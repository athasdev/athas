name: Release cache

# Release builds run on tags, and GitHub only lets a tag run restore caches
# saved by that tag or by main. This builds each release target on main the
# same way release.yml does, without bundling or signing, and saves the Rust
# dependency cache under the key release.yml restores.

on:
  push:
    branches: [main]
    paths:
      - "Cargo.lock"
      - "**/Cargo.toml"
      - "rust-toolchain.toml"
      - ".github/workflows/release-cache.yml"
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

concurrency:
  group: release-cache
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  warm:
    if: github.repository == 'athasdev/athas'
    name: Warm ${{ matrix.artifact }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            artifact: "macos-aarch64"
            os: "macos"
            target: "aarch64-apple-darwin"
            args: "--target aarch64-apple-darwin"
          - platform: "macos-latest"
            artifact: "macos-x86_64"
            os: "macos"
            target: "x86_64-apple-darwin"
            args: "--target x86_64-apple-darwin"
          - platform: "ubuntu-22.04"
            artifact: "linux-x86_64"
            os: "linux"
            target: ""
            args: ""
          - platform: "ubuntu-22.04-arm"
            artifact: "linux-aarch64"
            os: "linux"
            target: ""
            args: ""
          - platform: "windows-latest"
            artifact: "windows-x86_64"
            os: "windows"
            target: ""
            args: ""
          - platform: "windows-latest"
            artifact: "windows-aarch64"
            os: "windows"
            target: "aarch64-pc-windows-msvc"
            args: "--target aarch64-pc-windows-msvc"
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6

      - name: Free disk space (Linux only)
        if: matrix.os == 'linux'
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL || true
          sudo docker system prune -af || true

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.18.0
        with:
          node-version-file: .node-version
          cache: true
          run-install: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Ensure Rust target is installed
        if: matrix.target != ''
        run: rustup target add ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.artifact }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install dependencies (Linux only)
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            libdbus-1-dev libssl-dev patchelf xdg-utils file

      - name: Install frontend dependencies
        run: vp install --ignore-scripts

      - name: Build the release binary
        run: bun tauri build ${{ matrix.args }} --no-bundle
