name: "Test Build"

# Builds installers from any branch for manual testing. Nothing is tagged,
# released, signed or published to the updater: the installers are attached
# to the run as artifacts and expire after a week.

on:
  workflow_dispatch:
    inputs:
      windows:
        description: "Windows x86_64 (NSIS setup and MSI)"
        type: boolean
        default: true
      linux:
        description: "Linux x86_64 (deb, rpm, AppImage, tarball, Flatpak)"
        type: boolean
        default: true
      windows_arm:
        description: "Windows aarch64"
        type: boolean
        default: false
      linux_arm:
        description: "Linux aarch64"
        type: boolean
        default: false
      macos:
        description: "macOS aarch64 (unsigned)"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    if: github.repository == 'athasdev/athas'
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - id: plan
        env:
          WINDOWS: ${{ inputs.windows }}
          LINUX: ${{ inputs.linux }}
          WINDOWS_ARM: ${{ inputs.windows_arm }}
          LINUX_ARM: ${{ inputs.linux_arm }}
          MACOS: ${{ inputs.macos }}
        run: |
          set -euo pipefail
          entries=()
          [[ "$WINDOWS" == "true" ]] && entries+=('{"name":"windows-x86_64","os":"windows","runner":"windows-latest","args":"--bundles nsis,msi","bundle":"target/release/bundle"}')
          [[ "$WINDOWS_ARM" == "true" ]] && entries+=('{"name":"windows-aarch64","os":"windows","runner":"windows-latest","args":"--target aarch64-pc-windows-msvc --bundles nsis,msi","target":"aarch64-pc-windows-msvc","bundle":"target/aarch64-pc-windows-msvc/release/bundle"}')
          [[ "$LINUX" == "true" ]] && entries+=('{"name":"linux-x86_64","os":"linux","runner":"ubuntu-22.04","args":"--bundles deb,rpm,appimage","bundle":"target/release/bundle"}')
          [[ "$LINUX_ARM" == "true" ]] && entries+=('{"name":"linux-aarch64","os":"linux","runner":"ubuntu-22.04-arm","args":"--bundles deb,rpm,appimage","bundle":"target/release/bundle"}')
          [[ "$MACOS" == "true" ]] && entries+=('{"name":"macos-aarch64","os":"macos","runner":"macos-latest","args":"--target aarch64-apple-darwin --bundles dmg","target":"aarch64-apple-darwin","bundle":"target/aarch64-apple-darwin/release/bundle"}')
          if [[ ${#entries[@]} -eq 0 ]]; then
            echo "::error::Select at least one platform."
            exit 1
          fi
          matrix="{\"include\":[$(IFS=,; echo "${entries[*]}")]}"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v6

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.18.0
        with:
          node-version-file: .node-version
          cache: true
          run-install: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: test-build-${{ matrix.name }}
          cache-on-failure: true

      - name: Install Linux dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            libdbus-1-dev libssl-dev patchelf xdg-utils file flatpak
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub org.flatpak.Builder

      - name: Install frontend dependencies
        run: vp install --ignore-scripts

      - name: Build installers
        run: bun tauri build ${{ matrix.args }} --no-sign

      - name: Package Linux tarball and Flatpak
        if: matrix.os == 'linux'
        run: |
          set -euo pipefail
          bash scripts/release/package-linux-tarball.sh "${{ runner.arch }}" release-dist
          bash scripts/release/packaging/linux/flatpak.sh "${{ runner.arch }}" release-dist

      - name: Collect installers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-dist
          find "${{ matrix.bundle }}" -type f \
            \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' -o -name '*-setup.exe' \
               -o -name '*.msi' -o -name '*.dmg' \) -exec cp {} release-dist/ \;
          ls -lh release-dist

      - name: Upload installers
        uses: actions/upload-artifact@v6
        with:
          name: athas-${{ matrix.name }}-${{ github.sha }}
          path: release-dist/*
          if-no-files-found: error
          retention-days: 7
