name: "Linux Build"

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Linux runner to build on"
        required: true
        default: "ubuntu-22.04"
        type: choice
        options:
          - "ubuntu-22.04"
          - "ubuntu-22.04-arm"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.runner || 'ubuntu-22.04' }}
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'athasdev/athas'
    name: Build Linux packages
    runs-on: ${{ inputs.runner || 'ubuntu-22.04' }}
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.18.0
        with:
          node-version-file: .node-version
          cache: true
          run-install: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Cache Bun dependencies
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            libdbus-1-dev libssl-dev patchelf xdg-utils file flatpak
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub org.flatpak.Builder

      - name: Install frontend dependencies
        run: vp install --ignore-scripts && bun scripts/postinstall.ts

      - name: Build Linux packages
        run: bun tauri build --bundles deb,rpm,appimage --no-sign

      - name: Package Linux tarball and Flatpak
        run: |
          set -euo pipefail
          bash scripts/release/package-linux-tarball.sh "${{ runner.arch }}" release-dist
          bash scripts/release/packaging/linux/flatpak.sh "${{ runner.arch }}" release-dist
          find target/release/bundle -maxdepth 2 -type f \
            \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \) -exec cp {} release-dist/ \;
          ls -lh release-dist

      - name: Upload Linux packages
        uses: actions/upload-artifact@v6
        with:
          name: linux-${{ runner.arch }}
          path: release-dist/*
          if-no-files-found: error
