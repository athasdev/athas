name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  bun:
    if: github.repository == 'athasdev/athas'
    name: Bun — typecheck, frontend check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.18.0
        with:
          node-version-file: .node-version
          cache: true
          run-install: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: vp install --ignore-scripts && bun scripts/postinstall.ts

      - name: Run frontend checks
        run: bash scripts/check/frontend.sh

      - name: Run frontend tests with coverage
        run: vp test run --coverage

      - name: Summarize frontend coverage
        if: ${{ !cancelled() && hashFiles('coverage/coverage-summary.json') != '' }}
        run: bun scripts/check/coverage-summary.ts "Frontend coverage" coverage/coverage-summary.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload frontend coverage
        if: ${{ !cancelled() && hashFiles('coverage/lcov.info') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: coverage/
          retention-days: 14

  rust:
    if: github.repository == 'athasdev/athas'
    name: Rust — fmt, check, clippy, test
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy, llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Cache APT packages
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
          version: 1.0

      - name: Run Rust checks with coverage
        run: bash scripts/check/rust.sh --coverage

      - name: Summarize Rust coverage
        if: ${{ !cancelled() && hashFiles('target/llvm-cov/summary.json') != '' }}
        run: bun scripts/check/coverage-summary.ts "Rust coverage" target/llvm-cov/summary.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Rust coverage
        if: ${{ !cancelled() && hashFiles('target/llvm-cov/lcov.info') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: rust-coverage
          path: |
            target/llvm-cov/lcov.info
            target/llvm-cov/summary.json
            target/llvm-cov/html/
          retention-days: 14

  audit:
    if: github.repository == 'athasdev/athas'
    name: Audit — cargo audit, bun audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Audit Rust dependencies
        run: cargo audit

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Audit npm dependencies
        run: bun audit
