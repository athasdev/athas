name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: Check and test (macOS)
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: gpui-ci-macos

      - name: Check the workspace
        run: cargo check --workspace --all-targets --locked

      - name: Unit tests
        run: cargo test --workspace --lib --locked --no-fail-fast

      # Advisory: it reports spacing off the scale and hover states using the wrong colour, and
      # does not fail the build. Run it with `--strict` locally to have it exit non-zero.
      - name: Design guard
        run: python3 scripts/check-design.py

  linux:
    name: Check the Linux build
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: gpui-ci-linux

      # The same set the release workflow installs, so a release build is not the
      # first thing to compile for Linux. A macOS-only call (window traffic lights,
      # the platform crates) used to reach main green and break the release instead.
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang cmake pkg-config libssl-dev libfontconfig-dev \
            libwayland-dev libxkbcommon-x11-dev libx11-xcb-dev libvulkan-dev libzstd-dev libasound2-dev \
            libgtk-3-dev librsvg2-dev

      - name: Check the workspace
        run: cargo check --workspace --all-targets --locked

  wasm:
    name: Check the web build (wasm)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: gpui-ci-wasm

      - name: Check athas_web
        run: cargo check --target wasm32-unknown-unknown -p athas_web --locked
