name: Deploy Web App

# Builds Athas for the browser (bun run build:web) and deploys it to Cloudflare Workers static
# assets as the athas-web-app Worker on the routes athas.dev/app and athas.dev/app/*, where it
# shares the website's origin and session.
#
# Needs the repository secrets CLOUDFLARE_API_TOKEN (Workers Scripts: Edit, plus Zone: Workers
# Routes: Edit on athas.dev) and CLOUDFLARE_ACCOUNT_ID.

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "web.html"
      - "web/**"
      - "vite.config.ts"
      - "vite.web.config.ts"
      - "scripts/vite/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/deploy-web-app.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-web-app
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'athasdev/athas'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.18.0
        with:
          node-version-file: .node-version
          cache: true
          run-install: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: vp install --ignore-scripts

      - name: Test the web app
        run: vp test run src/features/web-workbench

      - name: Build the web app
        run: bun run build:web

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          wranglerVersion: "4"
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: web
          command: deploy
