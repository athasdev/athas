[package]
name = "wsl"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/wsl.rs"

[dependencies]
anyhow.workspace = true
gpui.workspace = true
file_tree = { path = "../file_tree" }
# The remote backends' shapes: `FileAccess`, `Contents` and `RemoteGit` over a `GitRunner`.
remote = { path = "../remote" }
# Athas's WSL crate (no Tauri dependency): distributions, path translation, file commands.
athas_wsl = { package = "athas-wsl", path = "../../core/wsl" }
