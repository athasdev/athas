[package]
name = "file_tree"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/file_tree.rs"

[dependencies]
gpui.workspace = true
anyhow.workspace = true
theme = { path = "../theme" }
ui = { path = "../ui" }
settings = { path = "../settings" }
extensions = { path = "../extensions" }
futures = "0.3"
ignore = "0.4"
web-time = "1"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
# Athas's project crate: the workspace file watcher and the fs moves it already gets right.
athas_project = { package = "athas-project", path = "../../core/project" }
trash = "5.3"

[target.'cfg(target_os = "macos")'.dependencies]
# NSFileManager reports where a trashed item landed, which `trash` does not; Undo needs it.
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSError", "NSFileManager", "NSGeometry", "NSString", "NSURL", "objc2-core-foundation"] }
raw-window-handle = "0.6"

[dev-dependencies]
tempfile = "3"
