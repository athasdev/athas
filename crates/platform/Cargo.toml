[package]
name = "platform"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/platform.rs"

[dependencies]
paths = { path = "../paths" }
gpui.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
futures = "0.3"
semver = "1"
url = "2"
ureq = { version = "3.5", default-features = false, features = ["rustls"] }
cli = { path = "../cli" }
keymap = { path = "../keymap" }
logging = { path = "../logging" }
notifications = { path = "../notifications" }
settings = { path = "../settings" }
telemetry = { path = "../telemetry" }
workbench = { path = "../workbench" }
# `athas://mcp/install` links open the MCP server editor.
agent_ui = { path = "../agent_ui" }
workbench_api = { path = "../workbench_api" }
workspace = { path = "../workspace" }
theme = { path = "../theme" }
onboarding = { path = "../onboarding" }
base64 = "0.22"
minisign-verify = "0.2"
tar = "0.4"
flate2 = "1"
# The first run after the Tauri app updated into this one (`tauri_import`).
dirs = "6"
log = "0.4"
rusqlite = { version = "0.29", features = ["bundled"] }
secure_storage = { path = "../secure_storage" }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
raw-window-handle = "0.6"

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
tempfile = "3"
ring = "0.17"
