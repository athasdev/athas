[package]
name = "sandbox"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/sandbox.rs"

[dependencies]
serde_json.workspace = true

# The provider talks HTTP, which the web build has no business doing: a sandbox is reached from
# the desktop app. Only the types and the Connect framing build for wasm.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
# The same rustls-only reqwest build telemetry and the GitHub client use.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "rustls-tls-native-roots"] }
base64 = "0.22"
# The key the provider is reached with lives in the OS keychain, not in settings.
secure_storage = { path = "../secure_storage" }
paths = { path = "../paths" }

[dev-dependencies]
telemetry = { path = "../telemetry", features = ["test-support"] }
