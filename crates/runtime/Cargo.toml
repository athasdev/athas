[package]
name = "athas-runtime"
version = "0.1.0"
edition = "2024"

[dependencies]
flate2 = "1.0"
log = "0.4"
reqwest = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
specta = { version = "=2.0.0-rc.25", features = ["derive", "serde_json"] }
tar = "0.4"
tempfile = "3.20"
tokio = { version = "1.0", features = ["io-util", "process", "rt", "time"] }
which = "7.0"
zip = "2.2"

[dev-dependencies]
athas-test-support = { path = "../test-support" }
tokio = { version = "1.0", features = ["io-util", "macros", "process", "rt", "time"] }

[lints]
workspace = true
