[package]
name = "athas-claude-ide"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1"
dirs = "5.0"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
getrandom = "0.2"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
specta = { version = "=2.0.0-rc.25", features = ["derive", "serde_json"] }
tokio = { version = "1.0", features = ["macros", "net", "rt", "sync", "time"] }
tokio-tungstenite = { version = "0.27", default-features = false, features = ["handshake"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1.0", features = ["macros", "net", "rt", "rt-multi-thread", "sync", "time"] }

[lints]
workspace = true
