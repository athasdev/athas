[package]
name = "athas-remote"
version = "0.1.0"
edition = "2024"

[dependencies]
athas-project = { path = "../project" }
athas-terminal = { path = "../terminal" }
base64 = "0.22"
dirs = "5.0"
sha2 = "0.10"
lazy_static = "1.4"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
specta = { version = "=2.0.0-rc.25", features = ["derive", "serde_json"] }
# libssh2 has no pure-Rust crypto backend: on macOS and Linux it links
# OpenSSL's libcrypto, so OpenSSL is vendored here for portable builds.
# This is the only crate in the workspace that pulls in OpenSSL.
ssh2 = { version = "0.9", features = ["vendored-openssl"] }
tauri = { version = "2.12", default-features = false, features = ["wry"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3.20"

[lints]
workspace = true
