[package]
name = "extension_host"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/extension_host.rs"

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
futures = "0.3"
regex = "1"
url = "2.5"
web-time = "1"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
rquickjs = { version = "0.14", default-features = false, features = ["std"] }
ureq = { version = "3.5", default-features = false, features = ["rustls"] }

[target.'cfg(target_family = "wasm")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Blob", "BlobPropertyBag", "Headers", "MessageEvent", "Request", "RequestInit", "RequestRedirect", "Response", "Storage", "Url", "Window", "Worker", "WorkerOptions", "WorkerType"] }

[dev-dependencies]
tempfile = "3"
