[package]
name = "tooling"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/tooling.rs"

[dependencies]
paths = { path = "../paths" }
serde.workspace = true
serde_json.workspace = true
# The old app's runtimes (bun, node, python, go, cargo downloads); no Tauri dependency.
athas-runtime = { path = "../../core/runtime" }
flate2 = "1.0"
futures-util = "0.3"
log = "0.4"
regex = "1.10"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "rustls-tls-native-roots", "stream"] }
tar = "0.4"
tempfile = "3"
# Installs run on their own runtime: reqwest and the runtimes need a tokio reactor.
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
url = "2.5"
walkdir = "2.5.0"
which = "7.0"
dirs = "6"
xz2 = { version = "0.1", features = ["static"] }
zip = "9"

[dev-dependencies]
athas-test-support = { path = "../../core/test-support" }
tokio = { version = "1", features = ["macros", "rt"] }
