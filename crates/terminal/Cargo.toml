[package]
name = "athas-terminal"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
athas-wsl = { path = "../wsl" }
dirs = "5.0"
log = "0.4"
libc = "0.2"
portable-pty = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.12", default-features = false }
uuid = { version = "1.0", features = ["v4", "serde"] }
specta = { version = "=2.0.0-rc.25", features = ["derive", "serde_json"] }
specta-typescript = "=0.0.12"
