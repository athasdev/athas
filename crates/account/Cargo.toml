[package]
name = "account"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/account.rs"

[dependencies]
paths = { path = "../paths" }
gpui.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
theme = { path = "../theme" }
ui = { path = "../ui" }
settings = { path = "../settings" }
notifications = { path = "../notifications" }
telemetry = { path = "../telemetry" }
keymap = { path = "../keymap" }
url = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "6"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
# The same rustls-only reqwest build the GitHub client uses.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "rustls-tls-native-roots"] }
secure_storage = { path = "../secure_storage" }

[target.'cfg(target_family = "wasm")'.dependencies]
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["XmlHttpRequest"] }

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
telemetry = { path = "../telemetry", features = ["test-support"] }
