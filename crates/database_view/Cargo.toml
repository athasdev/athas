[package]
name = "database_view"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/database_view.rs"

[features]
default = ["postgres", "mysql", "mongodb", "redis"]
# The network providers reuse the old app's sqlx code; they need a tokio runtime.
postgres = ["athas-database/postgres", "dep:tokio"]
mysql = ["athas-database/mysql", "dep:tokio"]
mongodb = ["athas-database/mongodb", "dep:tokio"]
redis = ["athas-database/redis", "dep:tokio"]
# DuckDB builds its C++ engine from source (several minutes, a lot of memory), so it is opt-in.
duckdb = ["athas-database/duckdb", "dep:tokio"]

[dependencies]
paths = { path = "../paths" }
gpui.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
theme = { path = "../theme" }
ui = { path = "../ui" }
palette = { path = "../palette" }
workbench_api = { path = "../workbench_api" }
unicode-segmentation = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
web-time = "1"

# On the web the workspace server opens the databases (`relay`); the browser compiles the old
# app's SQL helpers (`sql_common.rs`) from their source.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
# The old app's providers and SQL helpers (no Tauri dependency).
athas-database = { path = "../../core/database", default-features = false }
rusqlite = { version = "0.29", features = ["bundled"] }
dirs = "6"
secure_storage = { path = "../secure_storage" }
tokio = { version = "1", features = ["rt-multi-thread"], optional = true }

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
# `examples/database_snapshot.rs` renders the view into PNGs without a window.
gpui_platform = { workspace = true, features = ["test-support"] }
image = { version = "0.25", default-features = false, features = ["png"] }
