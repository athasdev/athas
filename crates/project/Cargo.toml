[package]
name = "athas-project"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
dirs = "5.0"
log = "0.4"
dunce = "1"
ignore = "0.4"
# Matches the version fff-search pulls in, so the app links a single notify.
notify = "9.0.0-rc.4"
roxmltree = "0.20"
rusqlite = { version = "0.29.0", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
tempfile = "3.20"
url = "2.5"
walkdir = "2.5.0"

[lints]
workspace = true
