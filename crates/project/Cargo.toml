[package]
name = "athas-project"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
log = "0.4"
dunce = "1"
ignore = "0.4"
# Matches the version fff-search pulls in, so the app links a single notify.
notify = "9.0.0-rc.4"
serde = { version = "1.0", features = ["derive"] }
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
tempfile = "3.20"

[dev-dependencies]
serde_json = "1.0"

[lints]
workspace = true
