# The original Athas Rust crates (git, LSP, terminal, database, ACP, ...). A workspace of its own
# so their `workspace = true` specs resolve here; the app in `crates/` uses them by path.

[workspace]
members = [
  "runtime",
  "wsl",
  "project",
  "version-control",
  "exec-path",
  "github",
  "fff-search",
  "browser",
  "docker",
  "claude-ide",
  "test-support",
]
# The Tauri-era crates the GPUI app has replaced: `ai` by crates/agent_ui and the
# crates/ai_* set, `lsp` by crates/lsp_client, `terminal` by crates/terminal_view,
# `remote` by crates/remote, `extensions` by crates/extension_host, `debugger` by
# crates/dap, `tooling` by crates/tooling. Nothing in `crates/` depends on them.
# They stay on disk as the port's reference, and out of the workspace so their
# `tauri -> gtk -> glib` tree stays out of Cargo.lock: that tree is the whole reason
# Dependabot kept opening an unresolvable glib security update against a dependency
# the app never builds.
exclude = [
  "ai",
  "debugger",
  "extensions",
  "lsp",
  "remote",
  "terminal",
  "tooling",
]
resolver = "2"

# Shared dependency specs that pin the workspace to a single TLS stack.
# reqwest uses rustls only (bundled webpki roots plus the OS trust store),
# and libgit2 is built without its HTTPS/SSH transports because every remote
# operation shells out to the git CLI. Neither pulls in native-tls/OpenSSL.
[workspace.dependencies]
git2 = { version = "0.20", default-features = false, features = ["vendored-libgit2"] }
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
  "rustls-tls-native-roots",
] }

[workspace.lints.clippy]
uninlined_format_args = "allow"
new_without_default = "allow"

