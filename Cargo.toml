[workspace]
resolver = "3"
members = ["crates/*"]
# The original Rust crates are a workspace of their own (core/Cargo.toml).
exclude = ["core"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "AGPL-3.0-or-later"
publish = false

[workspace.dependencies]
# GPUI from crates.io: the `gpui-pre-*` weekly snapshots of Zed's crates (the ones gpui-kit
# builds on), so a build never clones the Zed repository. A snapshot may change GPUI's API, so
# the pin is exact; bump every `gpui-pre-*` crate together.
gpui = { package = "gpui-pre", version = "=0.3.14" }
# Linux needs wayland and x11 turned on, or GPUI only builds its headless backend and the
# window never draws (#795).
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.14", default-features = false, features = ["font-kit", "runtime_shaders", "wayland", "x11"] }
http_client = { package = "gpui-pre-http-client", version = "=0.3.14" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[patch.crates-io]
# Builds for wasm without its PTY; see the crate's manifest.
alacritty_terminal = { path = "third_party/alacritty_terminal" }

# Debug info made the build folder grow past 13 GB and filled the disk; line tables keep
# backtraces readable at a fraction of the size, and dependencies carry none.
[profile.dev]
incremental = true
codegen-units = 16
debug = "line-tables-only"

[profile.dev.package]
"*" = { debug = false }
gpui-pre-macros = { opt-level = 3 }
gpui-pre-derive-refineable = { opt-level = 3 }
# The crates that run once per frame, or once per character of a frame: unoptimized, they are
# what makes a `cargo run` build stutter while it scrolls (#797). Optimizing them costs one
# longer first build and nothing after it -- they are dependencies, so an edit to `crates/`
# never rebuilds them, and the iteration loop stays as fast as it was.
cosmic-text = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
swash = { opt-level = 3 }
zeno = { opt-level = 3 }
ttf-parser = { opt-level = 3 }
taffy = { opt-level = 3 }
etagere = { opt-level = 3 }
lyon_path = { opt-level = 3 }
lyon_geom = { opt-level = 3 }
naga = { opt-level = 3 }
wgpu-hal = { opt-level = 3 }
wgpu-core = { opt-level = 3 }
ropey = { opt-level = 3 }
tree-sitter = { opt-level = 3 }
unicode-segmentation = { opt-level = 3 }
png = { opt-level = 3 }
image = { opt-level = 3 }

# Shipping desktop builds (`scripts/bundle-mac.sh --release`, the release workflow).
# opt-level 3: the editor's text layout and rendering want speed more than a few MB.
# Thin LTO across one codegen unit gets most of fat LTO's size win without its memory peak
# (fat LTO of the whole app needs well over 16 GB). Panics keep unwinding: 66 background
# threads (language servers, terminals, watchers, agents) rely on a panic ending only their
# own thread, and the telemetry panic hook still records it. Symbols are stripped; crash
# reports carry file and line from the panic location, not from debug info. Symbols stay: every
# crash report of 0.19 came back as a row of `athas ?` frames, which says nothing about where the
# app died, and `strip = "debuginfo"` drops the DWARF (the bulk) while keeping the names.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
debug = false
strip = "debuginfo"
incremental = false

# The web build (`scripts/build-web.sh --release`): small over fast.
[profile.web-release]
inherits = "release"
codegen-units = 16
opt-level = "s"
lto = "thin"
debug = false
strip = "debuginfo"
