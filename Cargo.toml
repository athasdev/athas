[workspace]
members = [
  "src-tauri",
  "crates/runtime",
  "crates/tooling",
  "crates/lsp",
  "crates/remote",
  "crates/wsl",
  "crates/project",
  "crates/version-control",
  "crates/extensions",
  "crates/terminal",
  "crates/ai",
  "crates/exec-path",
  "crates/github",
  "crates/fff-search",
  "crates/debugger",
  "crates/database",
]
resolver = "2"

# Shared dependency specs that pin the workspace to a single TLS stack.
# reqwest uses rustls only (bundled webpki roots plus the OS trust store),
# and libgit2 is built without its HTTPS/SSH transports because every remote
# operation shells out to the git CLI. Neither pulls in native-tls/OpenSSL.
[workspace.dependencies]
git2 = { version = "0.20", default-features = false, features = ["vendored-libgit2"] }
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
  "rustls-tls-native-roots",
] }

[workspace.lints.clippy]
uninlined_format_args = "allow"
new_without_default = "allow"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.dev]
incremental = false

[profile.dev.package.libduckdb-sys]
debug = 0

[profile.test.package.libduckdb-sys]
debug = 0
