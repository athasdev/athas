[workspace]
members = [
  "src-tauri",
  "crates/runtime",
  "crates/tooling",
  "crates/lsp",
  "crates/remote",
  "crates/wsl",
  "crates/project",
  "crates/version-control",
  "crates/extensions",
  "crates/terminal",
  "crates/ai",
  "crates/exec-path",
  "crates/github",
  "crates/fff-search",
  "crates/debugger",
  "crates/database",
]
resolver = "2"

[workspace.lints.clippy]
uninlined_format_args = "allow"
new_without_default = "allow"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.dev]
incremental = false

[profile.dev.package.libduckdb-sys]
debug = 0

[profile.test.package.libduckdb-sys]
debug = 0
