[package]
name = "athas"
version = "0.15.1"
description = "Athas code editor"
authors = ["you"]
edition = "2024"

[lints]
workspace = true

[lib]
name = "athas_text_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
anyhow = "1.0"
base64 = "0.21"
chrono = { version = "0.4.41", features = ["serde"] }
colored = "3.0.0"
crossbeam-channel = "0.5"
dirs = "5.0"
ec4rs = "1.2"
env_logger = "0.11.8"
futures-util = "0.3"
athas-runtime = { path = "../crates/runtime" }
athas-tooling = { path = "../crates/tooling" }
athas-lsp = { path = "../crates/lsp" }
athas-remote = { path = "../crates/remote" }
athas-wsl = { path = "../crates/wsl" }
athas-project = { path = "../crates/project" }
athas-version-control = { path = "../crates/version-control" }
athas-extensions = { path = "../crates/extensions" }
athas-terminal = { path = "../crates/terminal" }
athas-ai = { path = "../crates/ai" }
athas-github = { path = "../crates/github" }
athas-fff-search = { path = "../crates/fff-search" }
athas-debugger = { path = "../crates/debugger" }
athas-database = { path = "../crates/database", default-features = false, features = ["sqlite"] }
mimalloc = { version = "0.1", default-features = false }
log = "0.4.27"
percent-encoding = "2"
lsp-types = { version = "0.95", features = ["proposed"] }
portable-pty = "0.9"
regex = "1.10"
reqwest = { workspace = true, features = ["json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
roxmltree = "0.20"
rusqlite = { version = "0.29.0", features = ["bundled"] }
sha256 = "1.5"
tar = "0.4"
flate2 = "1.0"
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"
serde_json = "1.0"
keyring = { version = "3.6.3", features = [
  "apple-native",
  "crypto-rust",
  "sync-secret-service",
  "windows-native",
] }
tauri = { version = "2.12", features = ["macos-private-api", "protocol-asset"] }
tauri-plugin-dialog = { version = "2.8", default-features = false, features = ["xdg-portal"] }
tauri-plugin-fs = "2.6"
tauri-plugin-http = "2.8"
tauri-plugin-notification = "2.5"
tauri-plugin-log = "2.10"
tauri-plugin-opener = "2.7"
tauri-plugin-os = "2.4"
tauri-plugin-process = "2.4"
tauri-plugin-single-instance = "2.5"
tauri-plugin-store = "2.5"
tauri-plugin-updater = "2.13"
tokio = { version = "1.0", features = ["full"] }
url = "2.5"
uuid = { version = "1.0", features = ["v4", "serde"] }
walkdir = "2.5.0"
which = "7.0"
zip = "2.2"
tempfile = "3.20.0"
fontdb = "0.23.0"
ttf-parser = "0.25.1"
toml = "0.8"
tauri-plugin-clipboard-manager = "2.4"
tauri-plugin-deep-link = "2.6"
tauri-plugin-drag = "2.1.1"
async-trait = "0.1"
tokio-util = { version = "0.7", features = ["compat"] }
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
specta = { version = "=2.0.0-rc.25", features = ["derive", "serde_json"] }
specta-typescript = "=0.0.12"

[dev-dependencies]
tauri = { version = "2.12", features = ["test"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-window-state = "2.5"

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk-sys = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"
